name: Update Secrets

on:
  workflow_dispatch:
    inputs:
      variable_file:
        description: 'Select the variable file to update'
        required: true
        type: choice
        options:
          - group_vars/dev/vault.yml
          - group_vars/staging/vault.yml
          - group_vars/prod/vault.yml
      yaml_variables:
        description: |
          YAML content with variables to encrypt.
          Example:
            db_password: new_password
            api_key: new_key
        required: true
        type: string

permissions:
  contents: write   # needed to push the branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and PyYAML
        run: pip install ansible pyyaml

      - name: Create vault password file
        run: |
          mkdir -p /tmp/ansible
          echo "${{ secrets.VAULT_PASSWORD }}" > /tmp/ansible/vault_pass
        no_log: true

      - name: Write user‑provided variables to a temporary file
        run: echo '${{ inputs.yaml_variables }}' > /tmp/new_vars.yml
        no_log: true

      - name: Encrypt new values and update the selected file
        run: |
          python << 'EOF'
          import os
          import sys
          import yaml
          from ansible.parsing.vault import VaultLib, VaultSecret
          from ansible.parsing.yaml.dumper import AnsibleDumper
          from ansible.parsing.yaml.objects import AnsibleVaultEncryptedUnicode

          # 1. Read vault password
          with open('/tmp/ansible/vault_pass', 'r') as f:
              password = f.read().strip()
          vault = VaultLib(secrets=[VaultSecret(password)])

          # 2. Read new variables (YAML)
          with open('/tmp/new_vars.yml', 'r') as f:
              new_vars = yaml.safe_load(f)
          if not new_vars:
              sys.exit("No variables provided.")

          # 3. Read the existing vault file
          selected_file = "${{ inputs.variable_file }}"
          try:
              with open(selected_file, 'r') as f:
                  existing = yaml.safe_load(f) or {}
          except FileNotFoundError:
              existing = {}

          # 4. Encrypt each new value and update the dict
          for key, value in new_vars.items():
              ciphertext = vault.encrypt(str(value))
              encrypted_obj = AnsibleVaultEncryptedUnicode(ciphertext)
              encrypted_obj.vault = vault
              existing[key] = encrypted_obj

          # 5. Write back using Ansible's custom YAML dumper (preserves !vault tag)
          with open(selected_file, 'w') as f:
              yaml.dump(
                  existing,
                  f,
                  Dumper=AnsibleDumper,
                  default_flow_style=False,
                  allow_unicode=True,
                  sort_keys=False
              )
          EOF
        no_log: true

      - name: Create/force‑push update-secrets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B update-secrets
          git add "${{ inputs.variable_file }}"
          git commit -m "Update secrets via workflow_dispatch [skip ci]"
          git push origin update-secrets --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
